[workspace]
resolver = "2"
members = ["nexus-core", "nexus-ffi", "nexus-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["NexusView"]

[workspace.dependencies]
nexus-core = { path = "nexus-core" }
memmap2 = "0.9"
memchr = "2.7"
rayon = "1.10"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
encoding_rs = "0.8"
smallvec = "1.13"
thiserror = "2"

# Release profile tuned for Apple Silicon throughput (RNF-03).
# `panic = "unwind"` is required so the FFI layer can use catch_unwind as a
# crash backstop (RNF-05) — a panic must never cross the C boundary.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
